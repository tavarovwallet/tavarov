:root{
  --bg:#F5F5F7;
  --glow-1:rgba(106,53,242,.07); --glow-2:rgba(20,20,40,.03); --glow-3:rgba(20,20,40,0);
  --card:rgba(255,255,255,.94); --card-solid:#FFFFFF; --card-edge:rgba(20,20,40,.09);
  --card-hi:inset 0 1px 0 rgba(255,255,255,.9);

  --label:#0D0D10; --label-2:rgba(22,22,30,.64); --label-3:rgba(22,22,30,.42);

  --green:#15935A; --orange:#C27400; --red:#E0342A; --fill:rgba(20,20,40,.06);

  --mono:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,monospace;
}

*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0; min-height:100vh; color:var(--label); font-family:var(--font);
     font-size:17px; line-height:1.55; -webkit-font-smoothing:antialiased;

.qr img,.qr canvas{display:block; width:100%; max-width:220px; height:auto; image-rendering:pixelated}
.btn{display:flex; align-items:center; justify-content:center; gap:9px; width:100%; text-align:center;
     padding:15px 16px; border-radius:15px; font-weight:650; font-size:17px; border:1px solid transparent;
     cursor:pointer; font-family:inherit; text-decoration:none; margin-bottom:10px; line-height:1.25;
     transition:transform .12s ease, box-shadow .2s ease, opacity .2s ease}
.btn:active{transform:scale(.985)}
.btn[disabled]{opacity:.55; cursor:default; transform:none}
.btn-main{color:#fff; background:linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
          box-shadow:0 12px 26px -10px rgba(91,33,232,.60), inset 0 1px 0 rgba(255,255,255,.18)}

/* Значка у «другого кошелька» нет нарочно: с ним подпись на узком телефоне
   переносилась или обрезалась многоточием, а без него помещается целиком. */
.btn > span{min-width:0}
.btn .ico{width:20px; height:20px; flex:0 0 auto}
.row{display:flex; justify-content:space-between; gap:14px; padding:11px 0; border-bottom:1px solid var(--sep); font-size:15.5px}
.row:last-child{border-bottom:0}
.row span{color:var(--label-2)} .row b{font-weight:650; text-align:right; word-break:break-all}
.addr{font-family:var(--mono); font-size:12.5px}
.state{display:flex; align-items:center; gap:10px; font-weight:650; font-size:16px}
.dot{width:10px; height:10px; border-radius:50%; background:var(--orange); flex:0 0 auto;

@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.ok .dot{background:var(--green); animation:none; box-shadow:0 0 0 4px color-mix(in srgb, var(--green) 22%, transparent)}
.bad .dot{background:var(--red); animation:none; box-shadow:0 0 0 4px color-mix(in srgb, var(--red) 22%, transparent)}
.info .dot{background:var(--label-3); animation:none; box-shadow:none}
.note{background:var(--fill); border-radius:14px; padding:13px 15px; font-size:14.5px; color:var(--label-2); margin-top:14px}

.langs button[aria-pressed="true"]{background:var(--seg-on); color:var(--seg-on-text)}

<script>
/* Приглашение продавца: wallet.tavarov.com/ref?by=0x… (или ?by=имя).

   Продавец закрепляет пригласившего сам, подписью своего кошелька: одна
   операция setReferrer в контракте оплаты. Мы при этом ничего не держим и
   ничего не решаем. Закрепить можно один раз и только до первой продажи —
   так записано в контракте, и поменять это не может никто, включая нас.

   Пригласивший — только адрес. Имя принимаем на входе и сразу превращаем в
   адрес, а адрес показываем целиком до подписи: имя можно освободить и
   занять другим, и тогда доля ушла бы чужому. */
const PAY = '0x1Fc681FA250A17e66B57B7150F2EeD4e71D1Ca35';
const NAMES = '0xd6E8A78634bE366bDbD041227D1E94F5b374338e';
const RPCS = ['https://bsc-dataseed.binance.org', 'https://bsc-dataseed1.bnbchain.org', 'https://bsc-rpc.publicnode.com'];
const SEL = { setReferrer: '0xa18a7bfc', referralOf: '0xde6c736d', hasSold: '0xed14f20a', addressOf: '0xccf1454a' };
const ZERO = '0x0000000000000000000000000000000000000000';
const $ = id => document.getElementById(id);

const T = {
  ru: { badH: 'Ссылка приглашения неверная', badT: 'В ней нет адреса пригласившего. Попросите прислать ссылку заново.',

    who: 'Пригласил', p1: 'Закрепите пригласившего — год ему будет идти пятая часть НАШЕЙ комиссии с ваших продаж.',

    other: 'Закрепить другим кошельком', openIn: 'Откройте эту страницу в своём кошельке:',
    yourWallet: 'Ваш кошелёк', bind: 'Закрепить партнёра', gas: 'Кошелёк попросит подтвердить операцию. Нужно немного BNB на комиссию сети.',
    connecting: 'Подключаем кошелёк…', checking: 'Проверяем ваш кошелёк…', ready: 'Можно закреплять',
    self: 'Это ваш же адрес — пригласить самого себя нельзя.',
    already: 'У вас уже закреплён партнёр: ', alreadySame: 'Этот партнёр у вас уже закреплён. Всё готово.',
    sold: 'С этого кошелька уже были продажи — закрепить партнёра теперь нельзя. Так записано в контракте.',
    net: 'Переключите кошелёк на сеть BNB Chain и попробуйте ещё раз.',
    sending: 'Подтвердите операцию в кошельке…', waiting: 'Операция отправлена, ждём сеть…',
    done: 'Готово! Партнёр закреплён до ', notYet: 'Сеть ещё не подтвердила. Проверьте позже — повторять не нужно.',
    rejected: 'Операцию отменили в кошельке. Ничего не отправлено.', failed: 'Не получилось: ',
    noNode: 'Нет связи с сетью BNB Chain. Проверьте интернет.',
    about: 'Как работает партнёрская программа', contract: 'Контракт оплаты' },
  en: { badH: 'The invitation link is wrong', badT: 'It has no inviter address. Ask for the link again.',

    h: 'You were invited to Tavarov Pay', sub: 'Accept USDT and USDC: money straight to your wallet, 1% fee.',

    p4: 'It is one transaction on BNB Chain; the network fee is a fraction of a cent.',
    app: 'Open in NoN Wallet', appNote: 'No wallet? It is created for free in a minute, and the partner is filled in for you.',
    other: 'Confirm with another wallet', openIn: 'Open this page in your wallet:',
    yourWallet: 'Your wallet', bind: 'Confirm partner', gas: 'Your wallet will ask you to confirm. You need a little BNB for the network fee.',
    connecting: 'Connecting the wallet…', checking: 'Checking your wallet…', ready: 'Ready to confirm',
    self: 'This is your own address — you cannot invite yourself.',
    already: 'You already have a partner: ', alreadySame: 'This partner is already confirmed. All done.',
    sold: 'This wallet already had sales — a partner can no longer be set. That is how the contract works.',
    net: 'Switch your wallet to BNB Chain and try again.',
    sending: 'Confirm the transaction in your wallet…', waiting: 'Sent, waiting for the network…',
    done: 'Done! Partner confirmed until ', notYet: 'The network has not confirmed yet. Check later — no need to repeat.',
    rejected: 'The transaction was cancelled in the wallet. Nothing was sent.', failed: 'It did not work: ',
    noNode: 'No connection to BNB Chain. Check your internet.',
    about: 'How the partner program works', contract: 'Payment contract' }
};
let LANG = (() => {
  const q = new URLSearchParams(location.search).get('lang');
  if (q && T[q]) return q;
  const n = (navigator.language || 'en').slice(0, 2).toLowerCase();
  return ['ru', 'uk', 'be', 'kk', 'ky', 'uz', 'tg'].includes(n) ? 'ru' : 'en';
})();
const t = k => (T[LANG] && T[LANG][k] !== undefined) ? T[LANG][k] : T.en[k];
function applyLang(){
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t(el.dataset.t); });
  document.querySelectorAll('#langs button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.l === LANG)));
  $('aboutLink').href = 'https://tavarov.com/' + (LANG === 'ru' ? '' : 'en/') + 'partners';
  if (lastState) say(lastState.kind, lastState.text, lastState.note);
}
document.querySelectorAll('#langs button').forEach(b => b.onclick = () => { LANG = b.dataset.l; applyLang(); });

const pad = a => a.toLowerCase().replace(/^0x/, '').padStart(64, '0');
async function rpc(method, params){
  let last = null;
  for (const url of RPCS){
    try{
      const r = await fetch(url, { method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ jsonrpc: '2.0', id: 1, method, params }) });
      const d = await r.json();
      if (d.error){ last = d.error.message; continue; }
      return d.result;
    } catch(e){ last = String(e && e.message || e); }
  }
  throw new Error(last || 'no node');
}
const call = (to, data) => rpc('eth_call', [{ to, data }, 'latest']);
function encString(s){
  const b = new TextEncoder().encode(s);
  const hexb = [...b].map(x => x.toString(16).padStart(2, '0')).join('');
  return (32).toString(16).padStart(64, '0') + b.length.toString(16).padStart(64, '0') + hexb.padEnd(Math.ceil(hexb.length / 64) * 64 || 64, '0');
}
async function resolveBy(v){
  if (/^0x[0-9a-fA-F]{40}$/.test(v)) return v;
  const name = v.replace(/^@+/, '').toLowerCase();
  if (!/^[a-z][a-z0-9_]{2,19}$/.test(name)) return null;
  const r = await call(NAMES, SEL.addressOf + encString(name));
  const a = '0x' + String(r).slice(-40);
  return a.toLowerCase() === ZERO ? null : a;
}

let BY = null, account = null, provider = null, lastState = null;
function say(kind, text, note){
  lastState = { kind, text, note };
  $('stateBox').classList.remove('hidden');
  $('stateLine').className = 'state ' + (kind || '');
  $('stateText').textContent = text;
  $('stateNote').classList.toggle('hidden', !note);
  $('stateNote').textContent = note || '';
}

/* Кошельки в этом браузере: сначала по новому стандарту (EIP-6963), иначе
   window.ethereum. Нет ни одного — ссылки, открывающие страницу внутри
   приложения кошелька. */
const found = [];
window.addEventListener('eip6963:announceProvider', e => { if (e.detail && e.detail.provider) found.push(e.detail.provider); });
try{ window.dispatchEvent(new Event('eip6963:requestProvider')); } catch(e){}
function injected(){ return found[0] || (window.ethereum && typeof window.ethereum.request === 'function' ? window.ethereum : null); }
function walletLinks(){
  const url = location.origin + location.pathname + '?by=' + BY + '&lang=' + LANG;
  const bare = url.replace(/^https?:\/\//, '');
  return [
    { name: 'MetaMask', color: '#F6851B', href: 'https://metamask.app.link/dapp/' + bare },
    { name: 'Trust Wallet', color: '#0500FF', href: 'https://link.trustwallet.com/open_url?coin_id=20000714&url=' + encodeURIComponent(url) },
    { name: 'OKX Wallet', color: '#111111', href: 'https://web3.okx.com/download?deeplink=' + encodeURIComponent('okx://wallet/dapp/url?dappUrl=' + encodeURIComponent(url)) }
  ];
}

async function readRef(addr){
  const [ro, sold] = await Promise.all([call(PAY, SEL.referralOf + pad(addr)), call(PAY, SEL.hasSold + pad(addr))]);
  const d = String(ro).replace(/^0x/, '');
  const ref = '0x' + d.slice(24, 64);
  const until = parseInt(d.slice(64, 128) || '0', 16);
  return { referrer: ref.toLowerCase() === ZERO ? null : ref, until, sold: parseInt(String(sold), 16) === 1 };
}
const dateOf = s => { try{ return new Date(s * 1000).toLocaleDateString(LANG, { day: 'numeric', month: 'long', year: 'numeric' }); } catch(e){ return new Date(s * 1000).toISOString().slice(0, 10); } };

async function connect(){
  provider = injected();
  if (!provider) return;
  say('', t('connecting'));
  try{
    const accs = await provider.request({ method: 'eth_requestAccounts' });
    account = accs && accs[0];
    if (!account) throw new Error('no account');
    const chain = await provider.request({ method: 'eth_chainId' });
    if (String(chain).toLowerCase() !== '0x38'){
      try{ await provider.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: '0x38' }] }); }
      catch(e){
        if (e && e.code === 4902){
          await provider.request({ method: 'wallet_addEthereumChain', params: [{ chainId: '0x38', chainName: 'BNB Smart Chain',
            nativeCurrency: { name: 'BNB', symbol: 'BNB', decimals: 18 }, rpcUrls: [RPCS[0]], blockExplorerUrls: ['https://bscscan.com'] }] });
        } else { say('bad', t('net')); return; }
      }
    }
    await check();
  } catch(e){ say('bad', e && e.code === 4001 ? t('rejected') : t('failed') + (e && e.message || e)); }
}
async function check(){
  $('mine').textContent = account;
  $('bindBox').classList.add('hidden');
  if (account.toLowerCase() === BY.toLowerCase()){ say('bad', t('self')); return; }
  say('', t('checking'));
  let st;
  try{ st = await readRef(account); } catch(e){ say('bad', t('noNode')); return; }
  if (st.referrer){
    if (st.referrer.toLowerCase() === BY.toLowerCase()) say('ok', t('alreadySame'));
    else say('bad', t('already') + st.referrer);
    return;
  }
  if (st.sold){ say('bad', t('sold')); return; }
  say('info', t('ready'));
  $('bindBox').classList.remove('hidden');
}
async function bind(){
  const btn = $('bindBtn');
  btn.disabled = true;
  try{
    say('', t('sending'));
    const hash = await provider.request({ method: 'eth_sendTransaction', params: [{ from: account, to: PAY, data: SEL.setReferrer + pad(BY), value: '0x0' }] });
    say('', t('waiting'));
    for (let i = 0; i < 40; i++){
      await new Promise(r => setTimeout(r, 3000));
      let rc = null;
      try{ rc = await rpc('eth_getTransactionReceipt', [hash]); } catch(e){}
      if (rc && rc.blockNumber){
        if (rc.status === '0x0'){ say('bad', t('failed') + 'reverted'); return; }
        const st = await readRef(account).catch(() => null);
        say('ok', t('done') + (st && st.until ? dateOf(st.until) : '—'));
        $('bindBox').classList.add('hidden');
        return;
      }
    }
    say('info', t('notYet'));
  } catch(e){
    say('bad', e && e.code === 4001 ? t('rejected') : t('failed') + (e && e.message || e));
  } finally { btn.disabled = false; }
}

(async function start(){
  applyLang();
  const raw = (new URLSearchParams(location.search).get('by') || '').trim();
  let by = null;
  try{ by = raw ? await resolveBy(raw) : null; } catch(e){ by = null; }
  if (!by){
    $('bad').hidden = false;
    if (raw && !/^0x/.test(raw)){ $('bad').querySelector('.note').dataset.t = 'badName'; applyLang(); }
    return;
  }
  BY = by;
  $('by').textContent = BY;
  $('toApp').href = 'https://wallet.tavarov.com/?ref=' + BY;
  $('main').classList.remove('hidden');
  if (injected()){
    $('injBox').classList.remove('hidden');
    $('connectBtn').onclick = connect;
  } else {
    $('linksBox').classList.remove('hidden');
    const box = $('links');
    walletLinks().forEach(w => {
      const a = document.createElement('a'); a.className = 'wrow'; a.href = w.href; a.rel = 'noopener';
      const i = document.createElement('span'); i.className = 'wi'; i.style.background = w.color; i.textContent = w.name[0];
      const s = document.createElement('span'); s.textContent = w.name;
      a.appendChild(i); a.appendChild(s); box.appendChild(a);
    });
  }
  $('bindBtn').onclick = bind;
})();
</script>
</body>
