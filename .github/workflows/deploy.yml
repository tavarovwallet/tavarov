# Auto-deploy to Cloudflare Pages on every push to main.
#   www/ + functions/  -> tavarov-wallet  (wallet.tavarov.com: wallet, pay & donate pages, API, Telegram bot)
#   creator/           -> tavarov-creator (creator.tavarov.com: creator dashboard)
#   site/              -> tavarov-site    (tavarov.com)
# Manual run: Actions -> Deploy -> Run workflow.
# Needs the repository secret CLOUDFLARE_API_TOKEN (Account · Cloudflare Pages · Edit).
name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "all / wallet / creator / site"
        default: all
concurrency:
  group: deploy
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: dee58450dba50489948c254917eaa3c2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Token present
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::error::Add the CLOUDFLARE_API_TOKEN repository secret"; exit 1; fi
      - name: What changed
        id: c
        run: |
          T="${{ github.event.inputs.target }}"
          if [ -n "$T" ] && [ "$T" != "all" ]; then echo "$T=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          BEFORE="${{ github.event.before }}"
          if [ -z "$T" ] && [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            CH=$(git diff --name-only "$BEFORE" HEAD)
          else
            CH=$(printf "www/\ncreator/\nsite/\n")
          fi
          echo "$CH"
          echo "$CH" | grep -qE '^(www/|functions/)' && echo "wallet=1" >> "$GITHUB_OUTPUT" || true
          echo "$CH" | grep -q '^creator/' && echo "creator=1" >> "$GITHUB_OUTPUT" || true
          echo "$CH" | grep -q '^site/' && echo "site=1" >> "$GITHUB_OUTPUT" || true
      - name: Tests
        if: steps.c.outputs.wallet || steps.c.outputs.creator
        run: for t in tests/*.mjs; do node --experimental-vm-modules "$t"; done
      # Gas-free USDC on Base (functions/api/relay-base.js) needs a small relayer
      # wallet that pays gas. Its key is created here once, straight into the
      # Pages secrets, and never printed: nobody, human or bot, has seen it.
      # If the secrets cannot be listed, nothing is created (an existing key
      # must never be overwritten: the ETH on it would be stranded).
      - name: Relayer key for gas-free USDC on Base (created once)
        if: steps.c.outputs.wallet
        run: |
          if ! out=$(npx --yes wrangler@4 pages secret list --project-name tavarov-wallet 2>&1); then
            echo "::warning::could not list Pages secrets, relayer key left as is"; exit 0
          fi
          if echo "$out" | grep -q BASE_RELAYER_KEY; then echo "relayer key already set"; exit 0; fi
          node -e "process.stdout.write('0x'+require('crypto').randomBytes(32).toString('hex'))" \
            | npx --yes wrangler@4 pages secret put BASE_RELAYER_KEY --project-name tavarov-wallet >/dev/null
          echo "relayer key created"
      # BNB for one operation when MegaFuel refuses (functions/api/drip-bnb.js):
      # a small service wallet on BNB Chain. Same rules as the Base relayer key:
      # created once, straight into the Pages secrets, never printed, never
      # overwritten.
      - name: Service wallet key for BNB drip (created once)
        if: steps.c.outputs.wallet
        run: |
          if ! out=$(npx --yes wrangler@4 pages secret list --project-name tavarov-wallet 2>&1); then
            echo "::warning::could not list Pages secrets, drip key left as is"; exit 0
          fi
          if echo "$out" | grep -q BNB_DRIP_KEY; then echo "drip key already set"; exit 0; fi
          node -e "process.stdout.write('0x'+require('crypto').randomBytes(32).toString('hex'))" \
            | npx --yes wrangler@4 pages secret put BNB_DRIP_KEY --project-name tavarov-wallet >/dev/null
          echo "drip key created"
      - name: Deploy wallet.tavarov.com
        if: steps.c.outputs.wallet
        run: npx --yes wrangler@4 pages deploy www --project-name tavarov-wallet --branch main --commit-dirty=true
      - name: Deploy creator.tavarov.com
        if: steps.c.outputs.creator
        working-directory: creator
        run: npx --yes wrangler@4 pages deploy . --project-name tavarov-creator --branch production --commit-dirty=true
      - name: Put the Android app next to the site
        if: steps.c.outputs.site
        run: |
          # The APK is not in main: *.apk is ignored (and F-Droid must not find
          # binaries in the source). Since deploys moved here on 1 Nov the file
          # was simply missing, and tavarov.com/tavarov.apk answered with the
          # home page. It now lives alone on the android-apk branch, and
          # site/apk.json says exactly which file the page promises.
          git fetch --depth=1 origin android-apk
          git show FETCH_HEAD:tavarov.apk > site/tavarov.apk
          want=$(python3 -c "import json;print(json.load(open('site/apk.json'))['sha256'])")
          have=$(sha256sum site/tavarov.apk | cut -d' ' -f1)
          echo "apk.json $want"; echo "file     $have"
          [ "$want" = "$have" ] || { echo "::error::android-apk branch does not hold the APK that site/apk.json describes"; exit 1; }
      - name: Deploy tavarov.com
        if: steps.c.outputs.site
        working-directory: site
        run: npx --yes wrangler@4 pages deploy . --project-name tavarov-site --branch production --commit-dirty=true
      - name: Check live
        run: |
          sleep 20
          fail=0
          for u in https://wallet.tavarov.com/ https://wallet.tavarov.com/api/tg https://creator.tavarov.com/ https://tavarov.com/; do
            c=$(curl -s -o /dev/null -w '%{http_code}' -L "$u"); echo "$c $u"; [ "$c" = 200 ] || fail=1
          done
          # The download must be the APK the page shows, not a page.
          want=$(python3 -c "import json;print(json.load(open('site/apk.json'))['sha256'])")
          type=$(curl -s -o /tmp/live.apk -w '%{content_type}' https://tavarov.com/tavarov.apk)
          have=$(sha256sum /tmp/live.apk | cut -d' ' -f1)
          echo "tavarov.apk: $type, $(stat -c %s /tmp/live.apk) bytes, $have"
          [ "$have" = "$want" ] || { echo "::error::tavarov.com/tavarov.apk is not the APK from site/apk.json"; fail=1; }
          exit $fail

  android-release:
    # The same APK as a GitHub release, created once per version from
    # site/apk.json: tag wallet-v<version> on the commit it was built from.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish the release if it is not there yet
        run: |
          read tag ver code src want <<< "$(python3 -c "import json;d=json.load(open('site/apk.json'));print(d['tag'],d['version'],d['versionCode'],d['source'],d['sha256'])")"
          if gh release view "$tag" >/dev/null 2>&1; then echo "$tag is already published"; exit 0; fi
          git fetch --depth=1 origin android-apk
          git show FETCH_HEAD:tavarov.apk > tavarov.apk
          have=$(sha256sum tavarov.apk | cut -d' ' -f1)
          [ "$have" = "$want" ] || { echo "::error::android-apk branch does not hold the APK that site/apk.json describes"; exit 1; }
          {
            cat "fastlane/metadata/android/en-US/changelogs/$code.txt"
            echo
            echo "Install: download tavarov.apk on your phone and open it. It updates the app from tavarov.com in place; your wallet stays."
            echo
            echo "SHA-256: \`$have\`"
            echo
            echo "Signed with the same key as every tavarov.com build (certificate SHA-256 AB9F2354…8AB1)."
          } > notes.md
          gh release create "$tag" tavarov.apk --target "$src" --title "NoN Wallet $ver" --notes-file notes.md
