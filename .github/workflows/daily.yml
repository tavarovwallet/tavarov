# Every day at 09:00 Yekaterinburg (04:00 UTC): sites, bot, partner stats, fees.
# A failed run means something is broken; GitHub e-mails the owner.
name: Daily check
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/daily-check.mjs
