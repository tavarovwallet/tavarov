# Builds the Android app the way F-Droid does: copy www into the assets,
# then an unsigned `assembleRelease` with Gradle only (no Node, no signing key).
# Runs when the app or the wallet it wraps changes; the unsigned APK is kept as
# an artifact for 14 days so anyone can try it.
name: Android build
on:
  push:
    # Without "branches", GitHub ran this only for wallet-v* tags, so the build
    # check silently never ran for commits on main.
    branches: [main]
    paths:
      - "android-app/**"
      - "www/**"
      - ".github/workflows/android.yml"
    tags:
      - "wallet-v*"
  pull_request:
    paths:
      - "android-app/**"
      - "www/**"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Copy the wallet into the app
        run: sh android-app/sync-www.sh
      - name: Build unsigned release APK
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease
      - name: Check the APK
        run: |
          APK=android-app/android/app/build/outputs/apk/release/app-release-unsigned.apk
          ls -l "$APK"
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT2" dump badging "$APK" | head -3
          if unzip -p "$APK" 'classes*.dex' | grep -a -q -E "Lcom/google/(android/gms|firebase)/"; then
            echo "::error::Google Play services or Firebase classes found in the APK"; exit 1
          fi
          echo "No Google Play services or Firebase classes inside."
      # Run by hand (workflow_dispatch): also put the unsigned APK on the
      # android-unsigned branch, so it can be fetched with plain git and signed
      # on the owner's computer (the signing key never leaves it).
      - name: Unsigned APK to the android-unsigned branch (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=android-app/android/app/build/outputs/apk/release/app-release-unsigned.apk
          mkdir /tmp/u && cp "$APK" /tmp/u/app-release-unsigned.apk && cd /tmp/u
          echo "${GITHUB_SHA}" > source.txt
          git init -q -b android-unsigned && git add . 
          git -c user.name=ci -c user.email=ci@tavarov.com commit -qm "unsigned APK from ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" android-unsigned
      - uses: actions/upload-artifact@v4
        with:
          name: non-wallet-unsigned-apk
          path: android-app/android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 14
